    <!-- 認証チェック（最優先読み込み） -->
    <script>
        // 認証チェック関数
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/check.php', {
                    method: 'GET',
                    credentials: 'same-origin'
                });
                
                if (!response.ok) {
                    throw new Error('認証チェックに失敗しました');
                }
                
                const result = await response.json();
                
                if (!result.authenticated) {
                    // 未認証の場合はログイン画面にリダイレクト
                    alert('ログインが必要です。ログイン画面に移動します。');
                    window.location.href = '/login';
                    return false;
                }
                
                // 認証済みの場合、ユーザー情報を表示
                if (result.user) {
                    displayUserInfo(result.user);
                    // CSRFトークンを保存
                    if (result.csrf_token) {
                        sessionStorage.setItem('csrf_token', result.csrf_token);
                    }
                }
                
                return true;
            } catch (error) {
                console.error('認証チェックエラー:', error);
                alert('システムエラーが発生しました。ログイン画面に移動します。');
                window.location.href = '/login';
                return false;
            }
        }
        
        // ユーザー情報表示
        function displayUserInfo(user) {
            const userInfoElement = document.querySelector('.user-info');
            if (userInfoElement) {
                userInfoElement.innerHTML = `
                    <span class="user-role">${getRoleDisplayName(user.role)}</span>
                    <span class="username">${user.username}</span>
                    <button onclick="logout()" class="logout-btn">ログアウト</button>
                `;
            }
        }
        
        // ロール表示名取得
        function getRoleDisplayName(role) {
            const roleNames = {
                'superadmin': 'スーパー管理者',
                'admin': '管理者',
                'staff': 'スタッフ'
            };
            return roleNames[role] || role;
        }
        
        // ログアウト処理
        async function logout() {
            if (!confirm('ログアウトしますか？')) {
                return;
            }
            
            try {
                await fetch('/api/auth/logout.php', {
                    method: 'POST',
                    credentials: 'same-origin'
                });
            } catch (error) {
                console.error('ログアウトエラー:', error);
            } finally {
                sessionStorage.removeItem('csrf_token');
                window.location.href = '/login';
            }
        }
        
        // ページ読み込み時に認証チェック実行
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
        });
    </script>

    <script>
        let currentReservations = [];
        let availablePlans = [];

        // ページ読み込み時に予約一覧を取得
        document.addEventListener('DOMContentLoaded', function() {
            loadReservations();
        });

        // 予約一覧を取得
        async function loadReservations(params = {}) {
            try {
                showLoading();
                hideError();

                // URLパラメータを構築
                const queryParams = new URLSearchParams();
                Object.keys(params).forEach(key => {
                    if (params[key]) {
                        queryParams.append(key, params[key]);
                    }
                });

                const response = await fetch(`/osblog45.com/yoyaku/api/list_reservations.php?${queryParams}`);
                
                // レスポンステキストを確認
                const responseText = await response.text();
                console.log('API Response:', responseText);
                
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (parseError) {
                    console.error('JSON Parse Error:', parseError);
                    console.error('Response Text:', responseText);
                    throw new Error(`JSONパースエラー: ${responseText.substring(0, 100)}...`);
                }

                if (response.ok) {
                    currentReservations = data;
                    displayReservations(data);
                } else {
                    throw new Error(data.error || 'データの取得に失敗しました');
                }
            } catch (error) {
                console.error('Error loading reservations:', error);
                showError(error.message);
                showNoResults();
            } finally {
                hideLoading();
            }
        }

        // 予約一覧を表示
        function displayReservations(reservations) {
            const tbody = document.getElementById('reservations-tbody');
            const table = document.getElementById('reservations-table');
            const noResults = document.getElementById('no-results');
            const resultsCount = document.getElementById('results-count');

            if (reservations.length === 0) {
                showNoResults();
                resultsCount.textContent = '0件';
                return;
            }

            tbody.innerHTML = '';
            table.style.display = 'table';
            noResults.style.display = 'none';
            resultsCount.textContent = `${reservations.length}件`;

            reservations.forEach(reservation => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${reservation.id}</td>
                    <td>${reservation.customer.name}</td>
                    <td>${reservation.customer.phone}</td>
                    <td>${reservation.checkin_date}</td>
                    <td>${reservation.checkout_date}</td>
                    <td>${reservation.adults}名${reservation.children > 0 ? ` + 子${reservation.children}名` : ''}</td>
                    <td>${reservation.plan.name}</td>
                    <td>¥${reservation.price.toLocaleString()}</td>
                    <td><span class="payment-status payment-${reservation.payment_status}">${getPaymentStatusText(reservation.payment_status)}</span></td>
                    <td><span class="status status-${reservation.reservation_status}">${getReservationStatusText(reservation.reservation_status)}</span></td>
                    <td>${reservation.room.room_number || '未割当'}</td>
                    <td class="actions">
                        <button class="btn btn-primary btn-sm" onclick="viewReservation(${reservation.id})">詳細</button>
                        <button class="btn btn-success btn-sm" onclick="editReservation(${reservation.id})">編集</button>
                        <button class="btn btn-danger btn-sm" onclick="cancelReservation(${reservation.id})">キャンセル</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // 検索実行
        function searchReservations() {
            const params = {
                search: document.getElementById('search').value.trim(),
                checkinDate: document.getElementById('checkinDate').value,
                checkoutDate: document.getElementById('checkoutDate').value,
                status: document.getElementById('status').value
            };

            loadReservations(params);
        }

        // フィルターをクリア
        function clearFilters() {
            document.getElementById('search').value = '';
            document.getElementById('checkinDate').value = '';
            document.getElementById('checkoutDate').value = '';
            document.getElementById('status').value = '';
            loadReservations();
        }

        // 予約詳細表示
        function viewReservation(id) {
            const reservation = currentReservations.find(r => r.id === id);
            if (reservation) {
                alert(`予約詳細:\nID: ${reservation.id}\n顧客: ${reservation.customer.name}\n期間: ${reservation.checkin_date} 〜 ${reservation.checkout_date}\n料金: ¥${reservation.price.toLocaleString()}\n備考: ${reservation.notes || 'なし'}`);
            }
        }

        // プラン一覧を取得してセレクトボックスに設定
        async function loadPlans() {
            try {
                const response = await fetch('/osblog45.com/yoyaku/api/plans.php');
                const plans = await response.json();
                availablePlans = plans;
                
                const editPlanSelect = document.getElementById('editPlan');
                editPlanSelect.innerHTML = '';
                
                plans.forEach(plan => {
                    const option = document.createElement('option');
                    option.value = plan.name;
                    option.textContent = plan.name;
                    editPlanSelect.appendChild(option);
                });
            } catch (error) {
                console.error('プラン読み込みエラー:', error);
            }
        }

        // 予約編集モーダルを開く
        async function editReservation(id) {
            try {
                // プラン一覧を読み込み（初回のみ）
                if (availablePlans.length === 0) {
                    await loadPlans();
                }

                // 現在の予約データを取得
                const reservation = currentReservations.find(r => r.id === id);
                if (!reservation) {
                    alert('予約データが見つかりません');
                    return;
                }

                // フォームに現在の値を設定
                document.getElementById('editReservationId').value = reservation.id;
                document.getElementById('editCustomerName').value = reservation.customer.name;
                document.getElementById('editCustomerPhone').value = reservation.customer.phone;
                document.getElementById('editCustomerEmail').value = reservation.customer.email || '';
                document.getElementById('editPlan').value = reservation.plan.name;
                document.getElementById('editCheckinDate').value = reservation.checkin_date;
                document.getElementById('editCheckoutDate').value = reservation.checkout_date;
                document.getElementById('editAdults').value = reservation.adults;
                document.getElementById('editChildren').value = reservation.children;
                document.getElementById('editPrice').value = reservation.price;
                document.getElementById('editPaymentStatus').value = reservation.payment_status;
                document.getElementById('editNotes').value = reservation.notes || '';

                // モーダルを表示
                document.getElementById('editModal').style.display = 'flex';
            } catch (error) {
                console.error('編集モーダル表示エラー:', error);
                alert('編集画面の表示に失敗しました');
            }
        }

        // 予約編集モーダルを閉じる
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // 予約編集フォームの送信
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('editForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                try {
                    const formData = {
                        id: parseInt(document.getElementById('editReservationId').value),
                        name: document.getElementById('editCustomerName').value,
                        phone: document.getElementById('editCustomerPhone').value,
                        email: document.getElementById('editCustomerEmail').value,
                        plan: document.getElementById('editPlan').value,
                        checkinDate: document.getElementById('editCheckinDate').value,
                        checkoutDate: document.getElementById('editCheckoutDate').value,
                        adults: parseInt(document.getElementById('editAdults').value),
                        children: parseInt(document.getElementById('editChildren').value),
                        price: parseFloat(document.getElementById('editPrice').value),
                        payment_status: document.getElementById('editPaymentStatus').value,
                        notes: document.getElementById('editNotes').value
                    };

                    const response = await fetch('/osblog45.com/yoyaku/api/update_reservation.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData)
                    });

                    const result = await response.json();

                    if (result.success) {
                        alert('予約が正常に更新されました');
                        closeEditModal();
                        loadReservations(); // 一覧を再読み込み
                    } else {
                        alert('更新エラー: ' + result.message);
                    }
                } catch (error) {
                    console.error('更新エラー:', error);
                    alert('予約の更新に失敗しました');
                }
            });
        });

        // 予約キャンセルモーダルを開く
        function cancelReservation(id) {
            try {
                // 現在の予約データを取得
                const reservation = currentReservations.find(r => r.id === id);
                if (!reservation) {
                    alert('予約データが見つかりません');
                    return;
                }

                // キャンセル済みチェック
                if (reservation.reservation_status === 'cancelled') {
                    alert('この予約は既にキャンセル済みです');
                    return;
                }

                // 予約情報をモーダルに表示
                document.getElementById('cancelReservationInfo').innerHTML = `
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 4px; margin-bottom: 15px;">
                        <h4>キャンセル対象予約</h4>
                        <p><strong>予約ID:</strong> ${reservation.id}</p>
                        <p><strong>顧客名:</strong> ${reservation.customer.name}</p>
                        <p><strong>期間:</strong> ${reservation.checkin_date} 〜 ${reservation.checkout_date}</p>
                        <p><strong>料金:</strong> ¥${reservation.price.toLocaleString()}</p>
                        <p><strong>プラン:</strong> ${reservation.plan.name}</p>
                    </div>
                `;

                // フォームを初期化
                document.getElementById('cancelReservationId').value = reservation.id;
                document.getElementById('cancelReason').value = '';
                document.getElementById('refundAmount').value = '';
                document.getElementById('refundAmount').max = reservation.price;

                // モーダルを表示
                document.getElementById('cancelModal').style.display = 'flex';
            } catch (error) {
                console.error('キャンセルモーダル表示エラー:', error);
                alert('キャンセル画面の表示に失敗しました');
            }
        }

        // 予約キャンセルモーダルを閉じる
        function closeCancelModal() {
            document.getElementById('cancelModal').style.display = 'none';
        }

        // 予約キャンセルフォームの送信
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('cancelForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                if (!confirm('本当にこの予約をキャンセルしますか？この操作は取り消すことができません。')) {
                    return;
                }
                
                try {
                    const formData = {
                        id: parseInt(document.getElementById('cancelReservationId').value),
                        cancel_reason: document.getElementById('cancelReason').value,
                        refund_amount: parseFloat(document.getElementById('refundAmount').value) || 0
                    };

                    const response = await fetch('/osblog45.com/yoyaku/api/cancel_reservation.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData)
                    });

                    const result = await response.json();

                    if (result.success) {
                        let message = '予約が正常にキャンセルされました';
                        if (result.refund_amount > 0) {
                            message += `\n返金額: ¥${result.refund_amount.toLocaleString()}`;
                        }
                        alert(message);
                        closeCancelModal();
                        loadReservations(); // 一覧を再読み込み
                    } else {
                        alert('キャンセルエラー: ' + result.message);
                    }
                } catch (error) {
                    console.error('キャンセルエラー:', error);
                    alert('予約のキャンセルに失敗しました');
                }
            });
        });

        // ステータステキスト取得
        function getReservationStatusText(status) {
            const statusMap = {
                'unassigned': '未割当',
                'assigned': '割当済',
                'checked_in': 'チェックイン済',
                'checked_out': 'チェックアウト済',
                'cancelled': 'キャンセル'
            };
            return statusMap[status] || status;
        }

        function getPaymentStatusText(status) {
            const statusMap = {
                'unpaid': '未払い',
                'partial': '一部支払い',
                'paid': '支払済み'
            };
            return statusMap[status] || status;
        }

        // UI制御関数
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('reservations-table').style.display = 'none';
            document.getElementById('no-results').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showNoResults() {
            document.getElementById('no-results').style.display = 'block';
            document.getElementById('reservations-table').style.display = 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }

        // Enter キーで検索実行
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchReservations();
            }
        });
    </script>
</body>
</html>
